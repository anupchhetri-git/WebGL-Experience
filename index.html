<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anup Chhetri - Interactive WebGL Projects</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101218;
      color: #f5f5f7;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 64px 24px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin-top: 40px;
    }

    .card {
      display: block;
      overflow: hidden;
      border: 1px solid #343947;
      border-radius: 18px;
      background: #1b1f29;
      color: inherit;
      text-decoration: none;
    }

    .card:hover {
      border-color: #a5b4fc;
    }

    .card:focus-visible {
      outline: 3px solid #a5b4fc;
      outline-offset: 5px;
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
    }

    .details {
      padding: 24px;
    }

    h2 {
      margin: 0 0 12px;
    }

    .action {
      color: #b8c4ff;
      font-weight: 600;
    }

    @media (max-width: 650px) {
      .projects {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <p>Anup Chhetri - Interactive WebGL Projects</p>
    <h1>Choose a Project to Explore.</h1>

    <div class="projects">
      <a
        class="card"
        href="https://anupchhetri-git.github.io/Interactive_int_vis/"
      >
        <img
          src="interactive-preview.jpg"
          alt="Preview of Interactive Interior Visualisation"
        >
        <div class="details">
          <h2>Interactive Interior Visualisation</h2>
          <span class="action">Explore project →</span>
        </div>
      </a>

      <a
        class="card"
        href="https://anupchhetri-git.github.io/Augmenta/"
      >
        <img
          src="augmenta-preview.jpg"
          alt="Preview of Augmenta Village"
        >
        <div class="details">
          <h2>Augmenta Village</h2>
          <span class="action">Explore project →</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
